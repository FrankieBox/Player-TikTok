<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display - Estúdio TV Shorts</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Camada Sanduíche: Container Principal */
        .studio-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Camada 1 (Fundo/Vídeo): O Iframe do YouTube Shorts optimizado para vertical */
        .video-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Mantém o foco nos comandos externos se necessário */
        }

        /* Camada 2 (Sobreposição/Balões Flutuantes): Animações dinâmicas */
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 20px;
        }

        .balloon {
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: subirEFechar 4s ease-in-out forwards;
            max-width: 80%;
            align-self: center;
            text-align: center;
        }

        @keyframes subirEFechar {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
    </style>
</head>
<body>

    <div class="studio-container">
        <!-- Camada 1: Player do YouTube (Embed limpo para Shorts) -->
        <iframe 
            id="youtube-player"
            class="video-layer"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=1&mute=0&controls=0&loop=1" 
            allow="autoplay; encrypted-media">
        </iframe>

        <!-- Camada 2: Balões Flutuantes e Alertas Dinâmicos -->
        <div class="overlay-layer" id="balloon-container"></div>
    </div>

    <!-- Importa o Socket.io e a API do YouTube Iframe -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const socket = io();
        let player;

        // Inicializa o Player do YouTube via API oficial
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                events: {
                    'onReady': (event) => {
                        console.log("Player do YouTube pronto no Display.");
                    }
                }
            });
        }

        // 1. Ouvir comando para mudar de Short em tempo real
        socket.on('mudar_video', (dados) => {
            console.log("A receber novo vídeo:", dados.videoId);
            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(dados.videoId);
            } else {
                // Caso a API demore a carregar, altera diretamente o src do iframe
                const iframe = document.getElementById('youtube-player');
                iframe.src = `https://www.youtube.com/embed/${dados.videoId}?enablejsapi=1&autoplay=1&controls=0`;
            }
        });

        // 2. Ouvir comando para mostrar balão flutuante
        socket.on('mostrar_balao', (dados) => {
            console.log("A mostrar balão:", dados.mensagem);
            const container = document.getElementById('balloon-container');
            
            const balao = document.createElement('div');
            balao.className = 'balloon';
            balao.innerText = dados.mensagem;
            
            container.appendChild(balao);

            // Remove o balão do HTML após terminar a animação (4 segundos)
            setTimeout(() => {
                balao.remove();
            }, 4000);
        });

        // 3. Ouvir comandos gerais do player (Reproduzir, Pausar, Silenciar, Reiniciar)
        socket.on('comando_player', (dados) => {
            console.log("Comando recebido:", dados.acao);
            if (!player) return;

            if (dados.acao === 'play') {
                player.playVideo();
            } else if (dados.acao === 'pause') {
                player.pauseVideo();
            } else if (dados.acao === 'mute') {
                if (player.isMuted()) {
                    player.unMute();
                } else {
                    player.mute();
                }
            } else if (dados.acao === 'reset') {
                player.seekTo(0);
                player.playVideo();
            }
        });
    </script>
</body>
</html>
