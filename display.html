<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Display - Estúdio TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Container principal que faz o efeito "sanduíche" (Camadas) */
        .stage-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Camada 1: O Vídeo do YouTube (Fundo) */
        #youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Garante que cliques não interfiram no player */
        }

        /* Camada 2: A Camada de Balões Flutuantes e Alertas (Overlay) */
        #overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa os cliques passarem, se necessário */
            overflow: hidden;
            z-index: 10;
        }

        /* Estilo visual dos balões flutuantes */
        .floating-balloon {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc;
            animation: subirEdesaparecer 4s ease-in-out forwards;
        }

        /* Animação do balão a surgir e a desaparecer */
        @keyframes subirEdesaparecer {
            0% { opacity: 0; transform: translate(-50%, 30px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -40px); }
        }

        /* Mensagem de status inicial se não houver vídeo */
        #status-inicial {
            color: #fff;
            font-size: 20px;
            z-index: 5;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <!-- Status caso o servidor ainda não tenha enviado um vídeo -->
        <div id="status-inicial">Aguardando sinal da mesa de controlo...</div>

        <!-- Camada do Vídeo (Iframe do YouTube gerido dinamicamente) -->
        <iframe id="youtube-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>

        <!-- Camada superior para os balões flutuantes -->
        <div id="overlay-layer"></div>
    </div>

    <!-- Importa o script do Socket.io para comunicar com o servidor no Render -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Liga ao servidor Node.js hospedado no Render
        const socket = io();

        const iframe = document.getElementById('youtube-iframe');
        const overlay = document.getElementById('overlay-layer');
        const statusInicial = document.getElementById('status-inicial');

        // 1. Ouve o comando para trocar ou iniciar um vídeo do YouTube
        socket.on('mudar_video', (dados) => {
            console.log("Novo vídeo recebido:", dados.videoId);
            statusInicial.style.display = 'none'; // Esconde o texto de espera
            
            // Atribui o link do YouTube com autoplay ativado
            iframe.src = `https://www.youtube.com/embed/${dados.videoId}?autoplay=1&controls=0&modestbranding=1&rel=0`;
        });

        // 2. Ouve o comando para disparar um balão flutuante na tela
        socket.on('mostrar_balao', (dados) => {
            console.log("Novo balão:", dados.mensagem);
            
            // Cria um elemento HTML para o balão
            const balao = document.createElement('div');
            balao.className = 'floating-balloon';
            balao.innerText = dados.mensagem;

            // Adiciona o balão na camada superior
            overlay.appendChild(balao);

            // Remove o balão do HTML automaticamente assim que a animação termina (4 segundos)
            setTimeout(() => {
                balao.remove();
            }, 4000);
        });
    </script>
</body>
</html>
